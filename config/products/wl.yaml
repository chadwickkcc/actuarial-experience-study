# YAML mapping config for Whole Life (WL) product.
# Maps raw CSV column names to canonical silver_wl_policies column names
# with type casting and code-list translations.

source_product: WL
source_table: bronze_wl_policies
target_table: silver_wl_policies

field_mappings:
  - source_field: policy_id
    target_field: policy_id
    target_type: VARCHAR

  - source_field: product_code
    target_field: product_code
    target_type: VARCHAR

  - source_field: plan_code
    target_field: plan_code
    target_type: VARCHAR

  - source_field: issue_date
    target_field: issue_date
    target_type: DATE
    date_format: "%Y-%m-%d"

  - source_field: date_of_birth
    target_field: date_of_birth
    target_type: DATE
    date_format: "%Y-%m-%d"

  - source_field: issue_age_anb
    target_field: issue_age_anb
    target_type: INTEGER

  - source_field: gender
    target_field: gender
    target_type: VARCHAR

  - source_field: smoker_status
    target_field: smoker_status
    target_type: VARCHAR

  - source_field: risk_class
    target_field: risk_class
    target_type: VARCHAR

  - source_field: face_amount
    target_field: face_amount
    target_type: DOUBLE

  - source_field: premium_mode
    target_field: premium_mode
    target_type: VARCHAR

  - source_field: annual_premium
    target_field: annual_premium
    target_type: DOUBLE

  - source_field: reinsurance_flag
    target_field: reinsurance_flag
    target_type: BOOLEAN

  - source_field: status_code
    target_field: status_code
    target_type: VARCHAR

  - source_field: termination_date
    target_field: termination_date
    target_type: DATE
    date_format: "%Y-%m-%d"
    nullable: true

  - source_field: termination_cause_code
    target_field: termination_cause_code
    target_type: VARCHAR
    nullable: true

  - source_field: premium_paying_period
    target_field: premium_paying_period
    target_type: VARCHAR

  - source_field: guaranteed_cash_value
    target_field: guaranteed_cash_value
    target_type: DOUBLE

  - source_field: dividend_option_code
    target_field: dividend_option_code
    target_type: VARCHAR
    nullable: true

  - source_field: dividend_on_deposit_bal
    target_field: dividend_on_deposit_bal
    target_type: DOUBLE

  - source_field: paid_up_additions_face
    target_field: paid_up_additions_face
    target_type: DOUBLE

  - source_field: policy_loan_balance
    target_field: policy_loan_balance
    target_type: DOUBLE

  - source_field: auto_premium_loan_flag
    target_field: auto_premium_loan_flag
    target_type: BOOLEAN

  - source_field: non_forfeiture_status
    target_field: non_forfeiture_status
    target_type: VARCHAR

  - source_field: participating_flag
    target_field: participating_flag
    target_type: BOOLEAN

  - source_field: dividend_scale_rate
    target_field: dividend_scale_rate
    target_type: DOUBLE
    nullable: true

  - source_field: small_face_flag
    target_field: small_face_flag
    target_type: BOOLEAN

  - source_field: ci_rider_flag
    target_field: ci_rider_flag
    target_type: BOOLEAN

  - source_field: ci_rider_sum_assured
    target_field: ci_rider_sum_assured
    target_type: DOUBLE
    nullable: true

  - source_field: ci_rider_premium
    target_field: ci_rider_premium
    target_type: DOUBLE
    nullable: true

  - source_field: illness_code
    target_field: illness_code
    target_type: VARCHAR
    nullable: true

  - source_field: distribution_channel
    target_field: distribution_channel
    target_type: VARCHAR
    nullable: true

  - source_field: issue_state
    target_field: issue_state
    target_type: VARCHAR
    nullable: true

code_translations:
  status_code:
    "IF": "IF"
    "LAPSE": "LAPSE"
    "SURRENDER": "SURRENDER"
    "DEATH": "DEATH"
    "CI_CLAIM": "CI_CLAIM"

  termination_cause_code:
    "LAPSE": "LAPSE"
    "SURRENDER": "SURRENDER"
    "DEATH_BENEFIT_CLAIM": "DEATH_BENEFIT_CLAIM"
    "CI_ACCELERATED_BENEFIT": "CI_ACCELERATED_BENEFIT"

  non_forfeiture_status:
    "ACTIVE": "ACTIVE"
    "RPU": "RPU"
    "ETT": "ETT"
