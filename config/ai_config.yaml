      - assumption_set_id
      - sensitivity_id
      - product_code
      - anw
      - anw_required_capital
      - anw_free_surplus
      - pvfp
      - pvcoc
      - vif
      - tev
      - delta_tev
      # Profit-source margin breakdown (governed-maximum widening, 2026-06-27).
      - pvfp_mortality_margin
      - pvfp_lapse_margin
      - pvfp_ci_margin
      - pvfp_investment_spread
