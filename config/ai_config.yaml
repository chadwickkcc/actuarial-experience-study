# =============================================================================
# config/ai_config.yaml — AI layer settings (Tech Spec v2.0.1 §F.1)
# -----------------------------------------------------------------------------
# Single source for all non-secret AI settings. Every threshold, grain, cap, and
# seed lives here (NFR-CF-10); none is hard-coded.
#
# SESSION 14 SCOPE: only the `chatbot.allowlist` block is required now — it is
# the table/column allowlist consumed by src/utils/sql_boundary.load_allowlist
# (and shared with the MCP server, FR-3B-32). The full chatbot limits and the
# glm:/gbm:/eval: tuning blocks are authored in their owning sessions
# (15 / 16 / 20 / 22). The allowlist CONTENT below is finalised in Session 20;
# it is populated here from §F.1 so the loader and its tests are exercisable.
# =============================================================================

chatbot:
  max_turns_per_session: 30         # FR-3B-40 — prompt for a fresh session at the cap
  conversation_token_window: 16000  # FR-3B-39 — assembled-history trim window
  session_token_budget: 1000000     # FR-3B-44 — per-session token budget (NFR-L-01)
  budget_warning_fraction: 0.8      # FR-3B-44 — warn at 80%, hard-stop at 100%
  max_tokens:                       # per-call output caps (NFR-CF-10); generous headroom
    routing: 2048                   # for reasoning models (e.g. DeepSeek V4) whose hidden
    sql_generation: 2048            # reasoning tokens count against this budget — too
    commentary: 4096                # small a cap returns an empty completion the provider
    faithfulness: 64                # surfaces as an error (now a safe block, not silence).
    synthesis: 4096                 # multi-query EXPLORATORY synthesis (round 3, Phase D)
  faithfulness_llm_judge: false     # FR-3B-46 — optional judge (Session 21); deterministic checks always on
  faithfulness_flag_threshold: 3    # FR-3B-46 — 1-5 scale; <= threshold flags a draft (Session 21)
  analyst_mode_default: false       # round 3 — opt-in flag-not-block for numeric traceability;
                                    # default OFF keeps the hard guarantee (FR-3B-34). SQL gates never relax.
  multi_query_default: false        # round 3 Phase D — EXPLORATORY plan→fetch→synthesise; default OFF
                                    # (single-query path) so the eval harness/tests are unaffected; the
                                    # AI Analyst page turns it on for the richer experience.
  max_synthesis_queries: 4          # round 3 Phase D — max SELECTs an EXPLORATORY turn may plan
  sql_row_cap: 500                  # FR-3B-31 gate 4 (boundary default)
  rag:                              # FR-3B-36 — commentary grounds in the tool's OWN artifacts only
    reports_dir: reports            # generated A/E + TEV reports (relative to project root)
    methodology_docs:               # shipped methodology documentation (not an external KB)
      - Reference Materials/Life Insurance Experience Studies End-to-End Methodology and Practical Guide.md
      - Reference Materials/tev-methodology-report.md
    max_grounding_chars: 12000      # cap on assembled grounding text fed to the LLM
  allowlist:                        # FR-3B-32 — shared with MCP server; Gold tables -> permitted columns
    # Canonical gold_ae_results / gold_tev_results columns (Tech Spec §A.3/§A.4).
    # NO PII columns (no names, DOB, policy-holder identifiers) appear anywhere.
    gold_ae_results:
      - study_run_id
      - assumption_set_id
      - product_code
      - plan_code
      - gender
      - smoker_status
      - risk_class
      - issue_age_band
      - attained_age_band
      - duration_band
      - policy_year
      - calendar_year
      - is_plt_flag
      - premium_jump_ratio_band
      - distribution_channel
      - illness_code
      - exposure_count
      - exposure_amount
      - actual_deaths_count
      - expected_deaths_count
      - ae_count
      - ae_amount
      - credibility_z
      - lapse_exposure_count
      - actual_lapses
      - expected_lapses
      - ae_lapse
      - credibility_z_lapse
      - ci_exposure_count
      - actual_ci_claims
      - expected_ci_claims
      - ae_ci
      - credibility_z_ci
      - surrender_exposure
      - actual_surrenders
      - expected_surrenders
      - ae_surrender
      # Amount-basis deaths, standard errors, confidence-interval bounds, the
      # credibility-weighted A/E and the anti-selection flag (governed-maximum
      # data-surface widening, 2026-06-27). All non-PII.
      - actual_deaths_amount
      - expected_deaths_amount
      - se_ae_count
      - se_ae_amount
      - ci_lower_count
      - ci_upper_count
      - ci_lower_amount
