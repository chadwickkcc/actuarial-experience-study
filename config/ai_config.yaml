# =============================================================================
# GLM assumption engine (Session 15; Tech Spec v2.0.1 §F.1, Req §7.4)
# -----------------------------------------------------------------------------
# Every threshold, grain, seed, covariate list and validation tolerance lives
# here (NFR-CF-10); none is hard-coded in src/ai/glm/.
# =============================================================================
glm:
  seed: 42
  min_events_to_fit: 200            # FR-3A-29 guardrail (per decrement-product)
  bootstrap:
    n_resamples: 1000               # FR-3A-21
    ci_level: 0.95
  output_grain:                     # FR-3A-18
    mortality:    [product, sex, smoker, attained_age_band]
    lapse:        [product, duration_band]
    ci_incidence: [attained_age_band, sex]
  covariates:                       # FR-3A-13/16
    mortality:    [product_code, gender, smoker_status, risk_class, attained_age_band, duration_band, premium_jump_ratio_band]
    lapse:        [product_code, duration_band, premium_jump_ratio_band]
    ci_incidence: [attained_age_band, gender, smoker_status]
  validation:                       # FR-3A-26/27 tolerance table (explicit)
    min_expected_events: 30
    coverage_min: 0.90
    tolerance_pct:
      mortality: { TERM: 0.10, WL: 0.10, UL: 0.10, ULSG: 0.10, VUL: 0.10, DA: 0.15 }
      lapse:     { TERM: 0.15, WL: 0.25, UL: 0.15, ULSG: 0.15, VUL: 0.15, DA: 0.15 }
      ci_incidence: 0.20

# =============================================================================
# GBM overlay + SHAP (Session 16; Tech Spec v2.0.1 §F.1, Req §7.5)
# -----------------------------------------------------------------------------
# The GBM is the challenge/explain overlay, never the proposal engine. It is fit
# at the SAME output grain on the SAME covariates as the GLM (those lists and the
# validation tolerance table are reused from the glm: block above, so GLM and GBM
# are directly comparable). Only the GBM-specific knobs live here: fixed,
# version-controlled hyperparameters (no tuning, FR-3A-32), a pinned seed and
# single thread for bit-stable refits, the divergence-flag threshold (FR-3A-33),
# and an independently configurable bootstrap resample count (FR-3A-34).
# =============================================================================
gbm:
  seed: 42
  divergence_threshold: 0.10        # FR-3A-33 "interaction signal — investigate" flag
  bootstrap:
    n_resamples: 200                # FR-3A-34 (independent of the GLM's count)
    ci_level: 0.95
  hyperparams:                      # FIXED, no tuning (FR-3A-32); stability-over-fit
    max_depth: 3
    n_estimators: 200
    learning_rate: 0.05
    min_child_weight: 10            # sparse-cell guard
    gamma: 1.0                      # sparse-cell guard
    reg_lambda: 2.0                 # L2
    nthread: 1                      # determinism (bit-stable refits)
    cv_folds: 5                     # FR-3A-32 cross-validated deviance / logloss

# =============================================================================
# eval: — evaluation harness settings (Session 22; Tech Spec §F.1, FR-3B-53/54).
# -----------------------------------------------------------------------------
# The CLI harness (python -m src.ai.eval) shows an approximate cost estimate up
# front and requires interactive confirmation above this threshold (NFR-L-04).
# Live eval runs are owner-triggered and are NOT part of the pytest gate.
# =============================================================================
eval:
  eval_cost_confirm_threshold: 5.00   # USD; interactive confirm above this (NFR-L-04)
